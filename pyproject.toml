[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fuzzy-enigma"
version = "0.1.0"
description = "Monte Carlo pricing library for path-dependent exotic derivatives"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.maturin]
module-name = "fuzzy_enigma"
features = ["python"]
strip = true
