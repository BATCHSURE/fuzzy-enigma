[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fuzzy-enigma"
version = "0.1.0"
description = "Monte Carlo pricing library for path-dependent exotic derivatives"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
market = [
    "lseg-data==2.1.1",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.8,<4",
    "QuantLib>=1.40,<2",
]
notebooks = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[tool.maturin]
module-name = "fuzzy_enigma"
features = ["python"]
strip = true
