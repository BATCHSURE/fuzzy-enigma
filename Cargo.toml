[package]
name = "fuzzy-enigma"
version = "0.1.0"
edition = "2021"
description = "Monte Carlo pricing library for path-dependent exotic derivatives"
license = "MIT"
readme = "README.md"
repository = "https://github.com/BATCHSURE/fuzzy-enigma"
keywords = ["finance", "derivatives", "monte-carlo", "options", "quant"]
categories = ["finance", "mathematics", "simulation"]

[lib]
name = "fuzzy_enigma"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable the PyO3 bindings. Built via maturin from `pyproject.toml`;
# the pure-Rust build is unaffected.
python = ["dep:pyo3"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.8"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }

[[example]]
name = "price_options"
path = "examples/price_options.rs"

[profile.release]
lto = true
codegen-units = 1
